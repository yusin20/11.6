<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>日序｜個人行程與任務管理</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app-shell"><aside class="sidebar"><a class="brand"><span class="brand-mark">日</span><span><b>日序</b><small>MAKE ROOM FOR WHAT MATTERS</small></span></a><button class="primary full" id="quickAdd">＋ 新增項目</button><nav class="main-nav"><a class="nav-item active" data-view="dashboard"><span>◫</span>總覽</a><a class="nav-item" data-view="calendar"><span>▦</span>行事曆</a><a class="nav-item" data-view="tasks"><span>☑</span>任務</a><a class="nav-item" data-view="goals"><span>◎</span>長期目標</a></nav><div class="side-section"><div class="side-label">我的日曆 <button class="icon-btn" id="addCalendar">＋</button></div><label class="check-row"><i class="dot indigo"></i>個人行程<input type="checkbox" checked></label><label class="check-row"><i class="dot orange"></i>重要任務<input type="checkbox" checked></label><label class="check-row"><i class="dot green"></i>目標里程碑<input type="checkbox" checked></label></div><div class="sidebar-bottom"><div class="mini-profile"><div class="avatar">陳</div><span><b>陳小姐</b><small>個人工作區</small></span><button class="icon-btn" id="profileMenu" aria-label="工作區選單">⌄</button></div></div></aside><main class="main"><header class="topbar"><div class="breadcrumb"><button class="workspace-trigger" id="workspaceTrigger" aria-expanded="false"><span id="workspaceName">個人工作區</span><span class="workspace-caret">⌄</span></button><span class="crumb-sep">/</span><b id="pageCrumb">總覽</b></div><div class="top-actions"><button class="icon-btn notification" title="提醒">♧<i></i></button><div class="today-chip">週四，10月30日</div><div class="avatar small-avatar">陳</div></div></header><section id="content"></section></main></div>
<div class="workspace-menu hidden" id="workspaceMenu"><div class="workspace-menu-title">切換工作區</div><button class="workspace-option active" data-workspace="個人工作區"><span class="workspace-avatar">陳</span><span><b>個人工作區</b><small>只有你可以存取</small></span><span class="workspace-check">✓</span></button><div class="workspace-menu-divider"></div><button class="workspace-create" id="createWorkspace">＋ 建立工作區</button></div><div class="toast" id="toast"></div><dialog id="importantTasksDialog"><div class="important-dialog"><div class="dialog-head"><div><span class="eyebrow">PRIORITY TASKS</span><h2>重要任務</h2></div><button class="icon-btn" onclick="this.closest('dialog').close()">×</button></div><p class="form-hint">尚未完成且標記為高優先的任務。</p><div id="importantTasksList"></div><div class="dialog-actions"><button class="secondary" onclick="this.closest('dialog').close()">關閉</button></div></div></dialog><dialog id="itemDialog"><form method="dialog" id="itemForm"><div class="dialog-head"><div><span class="eyebrow">快速建立</span><h2 id="dialogTitle">新增項目</h2></div><button class="icon-btn" value="cancel">×</button></div><div class="form-grid"><label>項目類型<select id="itemType"><option value="task">任務</option><option value="event">行程</option><option value="goal">長期目標</option></select></label><label class="wide">名稱<input id="itemName" required placeholder="例如：完成提案初稿"></label><label>日期<input id="itemDate" type="date" required></label><label id="timeField">時間<input id="itemTime" type="time" value="09:00"></label><label id="durationField">預估時間<select id="itemDuration"><option>30 分鐘</option><option selected>1 小時</option><option>2 小時</option><option>半天</option></select></label><label id="goalDeadlineField" class="hidden">目標期限<input id="goalDeadline" type="date"></label></div><p class="form-hint" id="formHint">任務需指定日期，稍後可在任務清單中完成或調整。</p><div class="dialog-actions"><button class="secondary" value="cancel">取消</button><button class="primary" id="saveItem" value="default">建立項目</button></div></form></dialog><script src="app.js"></script></body></html>
